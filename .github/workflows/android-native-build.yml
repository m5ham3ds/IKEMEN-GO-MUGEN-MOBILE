name: Android Native Libraries (Test Build)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ikemen-android-native-test
  cancel-in-progress: false

jobs:
  build-android-native:
    name: Build arm64 Android native libraries
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out selected source ref
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Android build inputs
        shell: bash
        run: |
          set -euo pipefail

          test -f go.mod
          test -f build/build.sh
          test -f build/build_android.sh
          test -f build/docker/android/Dockerfile
          test -f build/docker/android/docker-compose.yml

          grep -Eq '^go [0-9]+\.[0-9]+(\.[0-9]+)?$' go.mod

          echo "Android build inputs are present."

      - name: Fix build script invocation for Docker
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          compose_file = Path(
              "build/docker/android/docker-compose.yml"
          )

          content = compose_file.read_text(encoding="utf-8")
          old_command = "./build/build.sh"
          new_command = "bash ./build/build.sh"

          if old_command not in content:
              raise SystemExit(
                  "ERROR: ./build/build.sh was not found in "
                  "build/docker/android/docker-compose.yml. "
                  "Inspect the actual Compose command before changing it."
              )

          updated = content.replace(old_command, new_command)
          compose_file.write_text(updated, encoding="utf-8")

          if new_command not in updated:
              raise SystemExit(
                  "ERROR: failed to update the Compose build command."
              )

          print("Docker Compose build command updated successfully.")

          for number, line in enumerate(
              updated.splitlines(), start=1
          ):
              if "build.sh" in line:
                  print(f"{number}: {line.strip()}")
          PY

          chmod +x build/build_android.sh

      - name: Build native Android libraries
        shell: bash
        env:
          BUILD_ANDROID_APK: "0"
          APP_VERSION: "mugen-mobile-test"
        run: |
          set -euo pipefail

          export APP_BUILDTIME="$(date -u +%Y.%m.%d)"

          docker --version
          docker compose version

          ./build/build_android.sh

      - name: Inspect native library symbols
        shell: bash
        run: |
          set -euo pipefail

          test -s bin/libmain.so

          if ! command -v readelf >/dev/null 2>&1; then
            echo "ERROR: readelf is not available on the runner." >&2
            exit 1
          fi

          echo "========================================"
          echo "ELF FILE INFORMATION"
          echo "========================================"

          file bin/libmain.so
          readelf -h bin/libmain.so

          echo "========================================"
          echo "EXPORTED DYNAMIC SYMBOLS"
          echo "========================================"

          if ! readelf --dyn-syms --wide bin/libmain.so \
            | grep -Ei 'SDL_main|nativeOnSDLReady|swap|tag|player|team|control'; then
            echo "No matching names found in the dynamic symbol table."
          fi

          echo "========================================"
          echo "FULL ELF SYMBOL TABLE"
          echo "========================================"

          if ! readelf --symbols --wide bin/libmain.so \
            | grep -Ei 'SDL_main|nativeOnSDLReady|swap|tag|player|team|control'; then
            echo "No matching names found in the ELF symbol table."
          fi

          echo "Symbol inspection completed."
          echo "An absent match does not by itself prove a feature is missing."

      - name: Verify and collect native outputs
        shell: bash
        run: |
          set -euo pipefail

          test -s bin/libmain.so
          test -s bin/libmain.h

          readelf -h bin/libmain.so | grep -q 'AArch64'

          mkdir -p artifact/libs

          cp -L bin/libmain.so artifact/libmain.so
          cp bin/libmain.h artifact/libmain.h

          shopt -s nullglob
          libraries=(lib/*.so*)

          if (( ${#libraries[@]} == 0 )); then
            echo "ERROR: no Android shared libraries were produced under lib/." >&2
            exit 1
          fi

          copied=0

          for src in "${libraries[@]}"; do
            if [[ -e "$src" || -L "$src" ]]; then
              cp -L "$src" "artifact/libs/$(basename "$src")"
              copied=$((copied + 1))
            fi
          done

          if (( copied == 0 )); then
            echo "ERROR: no dependency libraries could be copied." >&2
            exit 1
          fi

          {
            echo "Build purpose: MUGEN-MOBILE engine integration test"
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Ref: ${GITHUB_REF}"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Architecture: Android arm64-v8a (AArch64)"
            echo "Go requirement: $(awk '$1 == "go" { print $2; exit }' go.mod)"
            grep -E '^ARG (GO_VERSION|ANDROID_NDK_VERSION|ANDROID_PLATFORM|ANDROID_BUILD_TOOLS)=' build/docker/android/Dockerfile || true
            echo "APK packaging: disabled (BUILD_ANDROID_APK=0)"
          } > artifact/BUILD_INFO.txt

          (
            cd artifact

            find . -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )

          echo "========================================"
          echo "NATIVE LIBRARY OUTPUT SUMMARY"
          echo "========================================"

          file artifact/libmain.so artifact/libs/*
          du -ah artifact | sort -h | tail -30

      - name: Upload native libraries artifact
        uses: actions/upload-artifact@v7
        with:
          name: ikemen-android-native-test-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
